<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Kortex — a local-first AI memory layer for your codebase">
  <title>Kortex — a local-first AI memory layer for your codebase</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="50%" stop-color="#121c38"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .edge {
      stroke: #38bdf8;
      stroke-width: 1.4;
      fill: none;
      stroke-dasharray: 140;
      stroke-dashoffset: 140;
      opacity: 0.55;
      animation: draw 5s ease-in-out infinite;
    }
    @keyframes draw {
      0%   { stroke-dashoffset: 140; opacity: 0.15; }
      35%  { stroke-dashoffset: 0;   opacity: 0.75; }
      75%  { stroke-dashoffset: 0;   opacity: 0.5; }
      100% { stroke-dashoffset: 140; opacity: 0.15; }
    }
    .node {
      fill: #7dd3fc;
      animation: pulse 3.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { r: 4;   opacity: 0.65; }
      50%      { r: 6.5; opacity: 1; }
    }
    .hub { fill: #a5b4fc; animation: hubpulse 3.2s ease-in-out infinite; }
    @keyframes hubpulse {
      0%, 100% { r: 8;  opacity: 0.85; }
      50%      { r: 11; opacity: 1; }
    }
    .title {
      font: 800 46px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: url(#shine);
      letter-spacing: 2px;
    }
    .tag {
      font: 500 16px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #cbd5e1;
    }
    .meta {
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      fill: #64748b;
      letter-spacing: 1.4px;
    }
    .chip {
      font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      fill: #7dd3fc;
    }
    .fadein { opacity: 0; animation: fade 1s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>

  <rect width="880" height="220" rx="14" fill="url(#bg)"/>
  <circle cx="700" cy="110" r="150" fill="url(#glow)"/>

  <!-- graph -->
  <g transform="translate(0,0)">
    <path class="edge" style="animation-delay:0s"    d="M700,110 L612,62"/>
    <path class="edge" style="animation-delay:.35s"  d="M700,110 L700,44"/>
    <path class="edge" style="animation-delay:.7s"   d="M700,110 L792,70"/>
    <path class="edge" style="animation-delay:1.05s" d="M700,110 L616,158"/>
    <path class="edge" style="animation-delay:1.4s"  d="M700,110 L704,178"/>
    <path class="edge" style="animation-delay:1.75s" d="M700,110 L796,152"/>
    <path class="edge" style="animation-delay:2.1s"  d="M612,62 L700,44"/>
    <path class="edge" style="animation-delay:2.45s" d="M792,70 L796,152"/>
    <path class="edge" style="animation-delay:2.8s"  d="M616,158 L704,178"/>

    <circle class="hub"  cx="700" cy="110" r="8"/>
    <circle class="node" cx="612" cy="62"  r="4" style="animation-delay:.2s"/>
    <circle class="node" cx="700" cy="44"  r="4" style="animation-delay:.5s"/>
    <circle class="node" cx="792" cy="70"  r="4" style="animation-delay:.8s"/>
    <circle class="node" cx="616" cy="158" r="4" style="animation-delay:1.1s"/>
    <circle class="node" cx="704" cy="178" r="4" style="animation-delay:1.4s"/>
    <circle class="node" cx="796" cy="152" r="4" style="animation-delay:1.7s"/>
  </g>

  <!-- text -->
  <g class="fadein">
    <text class="title" x="56" y="92">KORTEX</text>
    <text class="tag"   x="58" y="124">A local-first AI memory layer for your codebase.</text>
    <text class="meta"  x="58" y="150">INDEX · SEARCH BY MEANING · TRACE · SERVE TO YOUR AGENT</text>
    <g class="chip">
      <text x="58"  y="182">◆ 22 languages</text>
      <text x="182" y="182">◆ 12 MCP tools</text>
      <text x="306" y="182">◆ runs offline</text>
      <text x="430" y="182">◆ one DuckDB file</text>
    </g>
  </g>
</svg>
